<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preloader Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3.0">
</head>
<body style="margin: 0; padding: 0; background-color: #D99A53;">

  <!-- Exact Preloader Component from index.html -->
  <div class="page-preloader" id="pagePreloader" style="background-color: #D99A53 !important; background: radial-gradient(circle at center, #F0BA7D 0%, #D99A53 60%, #BC7B34 100%) !important;" role="status" aria-live="polite" aria-label="Loading AzeeHealth Clinics">
    <div class="preloader-content">
      <!-- Concentric Sonar Halo Rings -->
      <div class="preloader-rings" aria-hidden="true">
        <span class="preloader-ring ring-1"></span>
        <span class="preloader-ring ring-2"></span>
        <span class="preloader-ring ring-3"></span>
      </div>

      <!-- Glowing Brand Logo Presentation -->
      <div class="preloader-logo-card">
        <img src="images/logo.png" alt="AzeeHealth Clinics - Precision | Care | Well Being" class="preloader-logo-img" width="280" height="60">
      </div>

      <!-- ECG Heartbeat Vitality Trace -->
      <div class="preloader-ecg-wrap" aria-hidden="true">
        <svg class="preloader-ecg-svg" viewBox="0 0 240 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path class="preloader-ecg-bg" d="M0,20 L65,20 L75,14 L85,26 L92,20 L105,20 L112,4 L120,36 L128,12 L134,24 L140,20 L152,20 L160,16 L168,20 L240,20" />
          <path class="preloader-ecg-pulse" d="M0,20 L65,20 L75,14 L85,26 L92,20 L105,20 L112,4 L120,36 L128,12 L134,24 L140,20 L152,20 L160,16 L168,20 L240,20" />
        </svg>
      </div>

      <!-- Clinic Motto & Dynamic Progress Bar -->
      <div class="preloader-meta">
        <span class="preloader-slogan">PRECISION &bull; CARE &bull; WELL BEING</span>
        <div class="preloader-progress-track" aria-hidden="true">
          <div class="preloader-progress-bar" id="preloaderProgressBar"></div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
